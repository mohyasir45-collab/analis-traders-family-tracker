const storage = {
  async get(key) {
    const raw = window.localStorage.getItem(key);
    if (raw === null) return null;
    return { value: raw };
  },
  async set(key, value) {
    window.localStorage.setItem(key, value);
    return { value };
  },
};

// ---- Helper: hitung sisa waktu & status dari target expiry date ----
function getTimeRemaining(expiryDate) {
  const total = expiryDate.getTime() - new Date().getTime();

  if (total <= 0) {
    return { total: 0, days: 0, hours: 0, minutes: 0, seconds: 0, status: "expired" };
  }

  const days = Math.floor(total / (1000 * 60 * 60 * 24));
  const hours = Math.floor((total / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((total / (1000 * 60)) % 60);
  const seconds = Math.floor((total / 1000) % 60);

  const status = days <= 3 ? "warning" : "active";

  return { total, days, hours, minutes, seconds, status };
}

const pad2 = (n) => String(n).padStart(2, "0");

const ID_MONTHS = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

// ---- Helper: Date -> label tampilan "dd MMM yyyy" (mis. "25 Jul 2026") ----
function formatDateLabel(date) {
  return date.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" });
}

const todayLabel = () => formatDateLabel(new Date());

// ---- Helper: parse label "dd MMM yyyy" -> Date (dipakai untuk mengisi ulang form edit) ----
function parseIndoDateLabel(label) {
  if (!label) return null;
  const parts = String(label).trim().split(/\s+/);
  if (parts.length !== 3) return null;
  const [dd, mon, yyyy] = parts;
  const monthIndex = ID_MONTHS.findIndex((m) => m.toLowerCase() === mon.toLowerCase());
  if (monthIndex === -1) return null;
  const d = new Date(Number(yyyy), monthIndex, Number(dd));
  return Number.isNaN(d.getTime()) ? null : d;
}

// ---- Helper: format Date -> value terpisah untuk <input type="date"> & <input type="time"> ----
function toDateInputValue(date) {
  const yyyy = date.getFullYear();
  const mm = pad2(date.getMonth() + 1);
  const dd = pad2(date.getDate());
  return `${yyyy}-${mm}-${dd}`;
}

function toTimeInputValue(date) {
  const hh = pad2(date.getHours());
  const mi = pad2(date.getMinutes());
  return `${hh}:${mi}`;
}

// ---- Helper: parse string harga "Rp 5.000.000" -> angka 5000000 ----
function parseRupiah(priceStr) {
  const digits = String(priceStr || "").replace(/[^0-9]/g, "");
  return digits ? Number(digits) : 0;
}

// ---- Helper: format angka -> "Rp 5.000.000" ----
function formatRupiah(value) {
  return `Rp ${Number(value || 0).toLocaleString("id-ID")}`;
}

// ---- Helper: serialize / deserialize untuk penyimpanan permanen ----
function serializeTraders(traders) {
  return JSON.stringify(
    traders.map((t) => ({ ...t, expiryDate: t.expiryDate.toISOString() }))
  );
}

function deserializeTraders(raw) {
  const parsed = JSON.parse(raw);
  return parsed.map((t) => ({ ...t, expiryDate: new Date(t.expiryDate) }));
}

    const tick = () => {
      const remaining = getTimeRemaining(expiryDate);
      setTimeLeft(remaining);
      onStatusChange?.(id, remaining.status);
      return remaining;
    };

    const initial = tick();
    if (initial.total <= 0) return;

      const remaining = tick();
      if (remaining.total <= 0) clearInterval(intervalId);

// ---- Modal form: berfungsi ganda untuk Tambah (add) & Ubah (edit) ----
function TraderFormModal({ open, mode, initialData, onClose, onSubmit }) {
  const [name, setName] = useState("");
  const [lot, setLot] = useState("");
  const [priceRaw, setPriceRaw] = useState("");
  const [startDateInput, setStartDateInput] = useState("");
  const [expiryDateInput, setExpiryDateInput] = useState("");
  const [expiryTimeInput, setExpiryTimeInput] = useState("");
  const [error, setError] = useState("");
  const backdropMouseDownOnSelf = React.useRef(false);

  useEffect(() => {
    if (!open) return;
    if (mode === "edit" && initialData) {
      setName(initialData.traderName);
      setLot(initialData.lot || "");
      setPriceRaw(String(initialData.price).replace(/[^0-9]/g, ""));
      setStartDateInput(toDateInputValue(parseIndoDateLabel(initialData.startDate) || new Date()));
      setExpiryDateInput(toDateInputValue(initialData.expiryDate));
      setExpiryTimeInput(toTimeInputValue(initialData.expiryDate));
    } else {
      setName("");
      setLot("");
      setPriceRaw("");
      setStartDateInput(toDateInputValue(new Date()));
      setExpiryDateInput("");
      setExpiryTimeInput("");
    }
    setError("");
  }, [open, mode, initialData]);

  if (!open) return null;

  const resetAndClose = () => {
    setError("");
    onClose();
  };

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!name.trim() || !priceRaw || !startDateInput || !expiryDateInput || !expiryTimeInput) {
      setError("Semua field wajib diisi.");
      return;
    }
    const startDateObj = new Date(`${startDateInput}T00:00:00`);
    if (Number.isNaN(startDateObj.getTime())) {
      setError("Tanggal mulai tidak valid.");
      return;
    }
    const expiryDate = new Date(`${expiryDateInput}T${expiryTimeInput}`);
    if (Number.isNaN(expiryDate.getTime())) {
      setError("Tanggal / jam berakhir tidak valid.");
      return;
    }

    onSubmit({
      traderName: name.trim(),
      lot: lot.trim(),
      price: `Rp ${Number(priceRaw).toLocaleString("id-ID")}`,
      startDate: formatDateLabel(startDateObj),
      expiryDate,
    });

    resetAndClose();
  };

  const isEdit = mode === "edit";

  const handleBackdropMouseDown = (e) => {
    backdropMouseDownOnSelf.current = e.target === e.currentTarget;
  };

  const handleBackdropClick = (e) => {

// ---- Layar login (email + password) sebelum masuk dashboard ----
function LoginScreen({ auth }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [loading, setLoading] = useState(false);
  const [showPassword, setShowPassword] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault();
    setError("");
    if (!email.trim() || !password) {
      setError("Email dan password wajib diisi.");
      return;
    }
    setLoading(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
    } catch (err) {
      const messages = {
        "auth/invalid-email": "Format email tidak valid.",
        "auth/user-not-found": "Akun tidak ditemukan.",
        "auth/wrong-password": "Password salah.",
        "auth/invalid-credential": "Email atau password salah.",
        "auth/too-many-requests": "Terlalu banyak percobaan, coba lagi nanti.",
      };
      setError(messages[err.code] || "Gagal masuk. Cek kembali email & password.");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center bg-neutral-950 p-4">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
        .font-jetbrains { font-family: 'JetBrains Mono', monospace; }
      `}</style>
      <div className="relative w-full max-w-sm rounded-2xl border border-white/10 bg-[#111111] p-6 sm:p-8 overflow-hidden">
        <div className="pointer-events-none absolute -top-20 -right-20 h-48 w-48 rounded-full bg-[#FF6A00]/10 blur-3xl" />
        <div className="relative">
          <p className="font-orbitron text-[10px] uppercase tracking-[0.3em] text-gray-500 mb-1">TRADERS FAMILY</p>
          <h1 className="font-rajdhani text-2xl font-bold uppercase tracking-widest bg-clip-text text-transparent bg-gradient-to-r from-[#FF6A00] to-white mb-6">
            Login
          </h1>

          <form onSubmit={handleSubmit} className="flex flex-col gap-4">
            <div>
              <label className="font-orbitron text-[9px] uppercase tracking-[0.2em] text-gray-500 mb-1.5 block">Email</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                autoComplete="username"
                placeholder="nama@email.com"
                className="w-full rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2.5 font-rajdhani text-sm text-white placeholder:text-gray-500 outline-none transition-all duration-300 focus:border-[#FF6A00]/70 focus:shadow-[0_0_16px_rgba(255,106,0,0.25)]"
              />
            </div>
            <div>
              <label className="font-orbitron text-[9px] uppercase tracking-[0.2em] text-gray-500 mb-1.5 block">Password</label>
              <div className="relative">
                <input
                  type={showPassword ? "text" : "password"}
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  autoComplete="current-password"
                  placeholder="••••••••"
                  className="w-full rounded-xl border border-white/10 bg-white/[0.03] px-3.5 py-2.5 pr-11 font-rajdhani text-sm text-white placeholder:text-gray-500 outline-none transition-all duration-300 focus:border-[#FF6A00]/70 focus:shadow-[0_0_16px_rgba(255,106,0,0.25)]"
                />
                <button
                  type="button"
                  onClick={() => setShowPassword((v) => !v)}
                  aria-label={showPassword ? "Sembunyikan password" : "Tampilkan password"}
                  className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-[#FF6A00] transition-colors duration-300"
                >
                  {showPassword ? <EyeOffIcon size={16} /> : <EyeIcon size={16} />}
                </button>
              </div>
            </div>

            {error && (
              <p className="font-jetbrains text-[11px] text-[#FF3366]">{error}</p>
            )}

            <button
              type="submit"
              disabled={loading}
              className="mt-1 w-full rounded-xl border border-[#FF6A00] bg-[#FF6A00] py-2.5 font-orbitron text-[11px] font-bold uppercase tracking-[0.15em] text-black transition-all duration-300 hover:bg-[#FF7E1F] disabled:opacity-50"
            >
              {loading ? "MEMPROSES..." : "MASUK"}
            </button>
          </form>

          <p className="font-jetbrains text-[10px] text-gray-500 mt-5 leading-relaxed">
            Belum punya akun? Minta admin buat akun untukmu lewat Firebase Console
            (Authentication → Users → Add user).
          </p>
        </div>
      </div>
    </div>
  );
}

// ---- Data awal 3 trader (dipakai hanya jika belum ada data tersimpan) ----
function buildInitialTraders() {
  const now = new Date();
  const inFuture = (days, hours = 0, minutes = 0) => {
    const d = new Date(now);
    d.setDate(d.getDate() + days);
    d.setHours(d.getHours() + hours);
    d.setMinutes(d.getMinutes() + minutes);
    return d;
  };

  return [
    { id: "trd-01", traderName: "Investor Alanis 01", lot: "LOT-01", price: "Rp 5.000.000", startDate: "01 Jul 2026", expiryDate: inFuture(4, 23, 59) },
    { id: "trd-02", traderName: "Investor Alanis 02", lot: "LOT-02", price: "Rp 7.500.000", startDate: "10 Jul 2026", expiryDate: inFuture(1, 14, 0) },
    { id: "trd-03", traderName: "Investor Alanis 03", lot: "LOT-03", price: "Rp 3.000.000", startDate: "15 Jun 2026", expiryDate: inFuture(-4, 0, 0) },
  ];
}

function App({ userEmail, onLogout }) {
  const [traders, setTraders] = useState(buildInitialTraders);
  const [hydrated, setHydrated] = useState(false);
  const [statusMap, setStatusMap] = useState({});
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("all");
  const [sortBy, setSortBy] = useState("nearest");
  const [modalOpen, setModalOpen] = useState(false);
  const [modalMode, setModalMode] = useState("add");
  const [editingTrader, setEditingTrader] = useState(null);
  const [showTotal, setShowTotal] = useState(() => {
    try {
      const raw = window.localStorage.getItem("tradersFamilyShowTotal");
      return raw === null ? true : raw === "1";
    } catch (err) {
      return true;
    }
  });
  const [syncStatus, setSyncStatus] = useState("connecting"); // connecting | online | offline | error
  const isRemoteUpdate = React.useRef(false);

  // ---- Simpan preferensi tampil/sembunyi Total Subs ----
  useEffect(() => {
    try {
      window.localStorage.setItem("tradersFamilyShowTotal", showTotal ? "1" : "0");
    } catch (err) {
      // abaikan jika localStorage tidak tersedia
    }
  }, [showTotal]);

  // ---- Muat data & dengarkan sync realtime ----
  // 1) Cache lokal (localStorage) dimuat dulu supaya UI langsung terisi.
  // 2) Kalau Firebase sudah dikonfigurasi, dengarkan Firestore secara realtime
  //    (onSnapshot) sehingga perubahan dari device lain otomatis masuk.
  useEffect(() => {
    let cancelled = false;

    (async () => {
      try {
        const cached = await storage.get(STORAGE_KEY);
        if (!cancelled && cached?.value) {
          setTraders(deserializeTraders(cached.value));
        }
      } catch (err) {
        // Belum ada cache lokal -> tetap pakai 3 data default
      }
      if (!firebaseReady) {
        if (!cancelled) {
          setHydrated(true);
          setSyncStatus("offline");
        }
      }
    })();

    if (firebaseReady && db) {
      const unsubscribe = db
        .collection(FIRESTORE_COLLECTION)
        .doc(FIRESTORE_DOC)
        .onSnapshot(
          (snap) => {
            if (cancelled) return;
            const data = snap.data();
            if (data?.traders) {
              isRemoteUpdate.current = true;
              setTraders(deserializeTraders(data.traders));
            }
            setHydrated(true);
            setSyncStatus("online");
          },
          (err) => {
            console.warn("Firestore sync error:", err);
            if (!cancelled) {
              setHydrated(true);
              setSyncStatus("error");
            }
          }
        );
      return () => {
        cancelled = true;
        unsubscribe();
      };
    }

    return () => {
      cancelled = true;
    };
  }, []);

  // ---- Simpan otomatis setiap kali traders berubah ----
  // Selalu simpan ke localStorage sebagai cache/offline fallback.
  // Kalau perubahan ini berasal dari snapshot Firestore (remote), jangan
  // dikirim balik ke Firestore supaya tidak terjadi loop tulis.
  useEffect(() => {
    if (!hydrated) return;

    (async () => {
      try {
        await storage.set(STORAGE_KEY, serializeTraders(traders));
      } catch (err) {
        // Gagal simpan lokal -> abaikan diam-diam, data tetap ada di state
      }
    })();

    if (isRemoteUpdate.current) {
      isRemoteUpdate.current = false;
      return;
    }

    if (firebaseReady && db) {
      db.collection(FIRESTORE_COLLECTION)
        .doc(FIRESTORE_DOC)
        .set({
          traders: serializeTraders(traders),
          updatedAt: window.firebase.firestore.FieldValue.serverTimestamp(),
        })
        .then(() => setSyncStatus("online"))
        .catch((err) => {
          console.warn("Gagal sync ke Firestore:", err);
          setSyncStatus("error");
        });
    }
  }, [traders, hydrated]);

  const handleStatusChange = useCallback((id, status) => {
    setStatusMap((prev) => (prev[id] === status ? prev : { ...prev, [id]: status }));
  }, []);

  const openAddModal = useCallback(() => {
    setModalMode("add");
    setEditingTrader(null);
    setModalOpen(true);
  }, []);

  const openEditModal = useCallback((trader) => {
    setModalMode("edit");
    setEditingTrader(trader);
    setModalOpen(true);
  }, []);

  const closeModal = useCallback(() => {
    setModalOpen(false);
    setEditingTrader(null);
  }, []);

  const handleModalSubmit = useCallback(
    (data) => {
      if (modalMode === "edit" && editingTrader) {
        setTraders((prev) =>
          prev.map((t) => (t.id === editingTrader.id ? { ...t, ...data } : t))
        );
      } else {
        setTraders((prev) => [
          ...prev,
          { id: `trd-${Date.now()}`, ...data },
        ]);
      }
    },
    [modalMode, editingTrader]
  );

  const handleDelete = useCallback(
    (id) => {
      const target = traders.find((t) => t.id === id);
      const namaTrader = target ? target.traderName : "investor ini";
      const confirmed = window.confirm(`Yakin ingin menghapus data ${namaTrader}?`);
      if (confirmed) {
        setTraders((prev) => prev.filter((t) => t.id !== id));
        setStatusMap((prev) => {
          const next = { ...prev };
          delete next[id];
          return next;
        });
      }
    },
    [traders]
  );

  const summary = useMemo(() => {
    const counts = { active: 0, warning: 0, expired: 0 };
    let totalValue = 0;
    traders.forEach((t) => {
      const st = statusMap[t.id];
      if (st) counts[st] += 1;
      totalValue += parseRupiah(t.price);
    });
    return { total: traders.length, totalValue, ...counts };
  }, [traders, statusMap]);

  const visibleTraders = useMemo(() => {
    const q = search.trim().toLowerCase();
    const filtered = traders.filter((t) => {
      const matchesSearch = !q || t.traderName.toLowerCase().includes(q);
      const matchesFilter = filter === "all" || statusMap[t.id] === filter;
      return matchesSearch && matchesFilter;
    });

    const sorted = [...filtered].sort((a, b) => {
      if (sortBy === "name") {
        return a.traderName.localeCompare(b.traderName, "id-ID");
      }
      const diff = a.expiryDate.getTime() - b.expiryDate.getTime();
      return sortBy === "furthest" ? -diff : diff;
    });

    return sorted;
  }, [traders, search, filter, statusMap, sortBy]);

  return (
    <div className="min-h-screen w-full max-w-full overflow-x-hidden bg-neutral-950 p-4 sm:p-6 md:p-10">
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .font-rajdhani { font-family: 'Rajdhani', sans-serif; }
        .font-jetbrains { font-family: 'JetBrains Mono', monospace; }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="datetime-local"]::-webkit-calendar-picker-indicator {
          filter: invert(1) brightness(1.6);
          cursor: pointer;
        }

        /* ---- Industrial Scrollbar: Orange / Dense Gray ---- */
        * {
          scrollbar-width: thin;
          scrollbar-color: #FF6A00 #1a1a1a;
        }
        ::-webkit-scrollbar {
          width: 10px;
          height: 10px;
        }
        ::-webkit-scrollbar-track {
          background: #141414;
        }
        ::-webkit-scrollbar-thumb {
          background: #FF6A00;
          border-radius: 999px;
          border: 2px solid #141414;
        }
        ::-webkit-scrollbar-thumb:hover {
          background: #FF7E1F;
          box-shadow: 0 0 8px rgba(255,106,0,0.6);
        }

        /* ---- Add Trader button: thin roaming orange glow ---- */
        @keyframes pulseGlow {
          0%, 100% {
            box-shadow: 0 0 10px rgba(255,106,0,0.35), 0 0 0px rgba(255,106,0,0);
          }
          50% {
            box-shadow: 0 0 22px rgba(255,106,0,0.65), 0 0 6px rgba(255,106,0,0.4);
          }
        }
        .btn-add-glow {
          animation: pulseGlow 2.4s ease-in-out infinite;
        }
        .btn-add-glow:hover {
          animation-play-state: paused;
          box-shadow: 0 0 26px rgba(255,106,0,0.8);
        }

        /* ---- Empty state: blinking terminal text ---- */
        @keyframes termBlink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.25; }
        }
        .term-blink {
          animation: termBlink 1.4s steps(2, start) infinite;
        }
      `}</style>

      <div className="relative max-w-6xl mx-auto">
        {/* ---- Header Dasbor ---- */}
        <div className="mb-6 sm:mb-8 max-w-full">
          <div className="flex flex-wrap items-center justify-end gap-2">
            <div className="flex items-center gap-2 min-w-0">
              {userEmail && (
                <span
                  className="hidden sm:inline-flex items-center gap-1.5 rounded-full border border-white/10 bg-white/[0.03] px-2.5 py-1 font-jetbrains text-[10px] text-gray-400 truncate max-w-[180px]"

          <div className="flex items-center gap-2 min-w-0">
            <span className="h-2 w-2 shrink-0 rounded-full" style={{ backgroundColor: "#FF6A00", boxShadow: "0 0 8px #FF6A00" }} />
            <span className="font-orbitron text-[9px] sm:text-[10px] tracking-[0.15em] sm:tracking-[0.2em] text-gray-500 truncate">
              TOTAL SUBS
            </span>
          </div>
          <div className="flex items-center gap-3">
            <span
              className="font-jetbrains text-base sm:text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-[#FF6A00] select-none"
              style={{ filter: "drop-shadow(0 0 8px rgba(255,106,0,0.35))", letterSpacing: showTotal ? "normal" : "0.15em" }}
            >
              {showTotal ? formatRupiah(summary.totalValue) : "••••••••"}
            </span>
            <button
              type="button"
              onClick={() => setShowTotal((v) => !v)}
              aria-label={showTotal ? "Sembunyikan total subs" : "Tampilkan total subs"}
              title={showTotal ? "Sembunyikan total subs" : "Tampilkan total subs"}
              className="shrink-0 rounded-lg border p-1.5 transition-all duration-300"
              style={{
                borderColor: "rgba(255,255,255,0.1)",
                backgroundColor: "rgba(255,255,255,0.03)",
                color: "#9ca3af",
              }}
              onMouseEnter={(e) => {
                e.currentTarget.style.borderColor = "#FF6A0080";
                e.currentTarget.style.color = "#FF6A00";
                e.currentTarget.style.boxShadow = "0 0 10px #FF6A0059";
              }}
              onMouseLeave={(e) => {
                e.currentTarget.style.borderColor = "rgba(255,255,255,0.1)";
                e.currentTarget.style.color = "#9ca3af";
                e.currentTarget.style.boxShadow = "none";
              }}
            >
              {showTotal ? <EyeIcon size={16} /> : <EyeOffIcon size={16} />}
            </button>
          </div>
        </div>

        {/* ---- Control Bar: Search + Sort + Filter + Add Trader ---- */}
        <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:justify-between mb-8 rounded-2xl border border-white/10 bg-[#111111] p-3 sm:p-4">
          <div className="flex flex-wrap items-center gap-3 flex-1 min-w-0">
            <SearchBar value={search} onChange={setSearch} />
            <SortDropdown value={sortBy} onChange={setSortBy} />
            <div className="w-full sm:w-auto min-w-0">
              <FilterButtons active={filter} onChange={setFilter} />
            </div>
          </div>
          <button
            onClick={openAddModal}
            className="btn-add-glow shrink-0 w-full lg:w-auto rounded-xl border border-[#FF6A00] bg-[#FF6A00] px-4 sm:px-5 py-2.5 font-orbitron text-[11px] font-bold uppercase tracking-[0.15em] text-black transition-all duration-300 hover:bg-[#FF7E1F] hover:-translate-y-0.5"
          >
            + ADD ANALIS
          </button>
        </div>

        {/* ---- Grid Kartu Multi-Investor ---- */}
        {visibleTraders.length > 0 ? (
          <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
            {visibleTraders.map((t) => (
              <TraderSubscriptionCard
                key={t.id}
                id={t.id}
                traderName={t.traderName}
                lot={t.lot}
                price={t.price}
                startDate={t.startDate}
                expiryDate={t.expiryDate}
                onStatusChange={handleStatusChange}
                onEdit={() => openEditModal(t)}
                onDelete={() => handleDelete(t.id)}
              />
            ))}
          </div>
        ) : (
          <div className="relative overflow-hidden rounded-2xl border border-[#FF3366]/20 bg-[#111111] py-16 px-6 text-center">
            <div className="pointer-events-none absolute inset-0 opacity-[0.06]" style={{
              backgroundImage: "linear-gradient(#FF3366 1px, transparent 1px), linear-gradient(90deg, #FF3366 1px, transparent 1px)",
              backgroundSize: "32px 32px",
            }} />

            <div className="relative flex flex-col items-center gap-4">
              <div
                className="flex h-16 w-16 items-center justify-center rounded-full border"
                style={{ borderColor: "#FF336666", boxShadow: "inset 0 0 18px rgba(255,51,102,0.25), 0 0 20px rgba(255,51,102,0.2)" }}
              >
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#FF3366" strokeWidth="1.6">
                  <circle cx="12" cy="12" r="9" opacity="0.5" />
                  <circle cx="12" cy="12" r="5" opacity="0.7" />
                  <circle cx="12" cy="12" r="1.4" fill="#FF3366" stroke="none" />
                  <line x1="12" y1="1.5" x2="12" y2="4.5" />
                  <line x1="12" y1="19.5" x2="12" y2="22.5" />
                  <line x1="1.5" y1="12" x2="4.5" y2="12" />
                  <line x1="19.5" y1="12" x2="22.5" y2="12" />
                </svg>
              </div>

              <p className="font-orbitron text-[11px] font-bold tracking-[0.3em] text-[#FF3366] term-blink">
                :: NO_SIGNAL_DETECTED ::
              </p>
              <p className="font-jetbrains text-[11px] tracking-[0.05em] text-gray-500 max-w-sm">
                <span className="text-[#FF3366]/80">&gt;</span> query returned 0 results — tidak ada investor yang cocok dengan pencarian / filter ini.
              </p>
            </div>
          </div>
        )}
      </div>

      <TraderFormModal
        open={modalOpen}
        mode={modalMode}
        initialData={editingTrader}
        onClose={closeModal}
        onSubmit={handleModalSubmit}
      />
    </div>
  );
}

// ---- Gerbang autentikasi: tampilkan login dulu sebelum masuk dashboard ----
function Root() {
  const [user, setUser] = useState(undefined); // undefined = loading, null = logged out

  useEffect(() => {
    if (!firebaseReady || !auth) {
      setUser(null);
      return;
    }
    const unsubscribe = auth.onAuthStateChanged((u) => setUser(u));
    return () => unsubscribe();
  }, []);

  // Kalau Firebase/Auth belum dikonfigurasi, langsung jalankan dashboard
  // tanpa login (fallback mode lokal, sama seperti sebelumnya).
  if (!firebaseReady || !auth) {
    return <App />;
  }

  if (user === undefined) {
    return (
      <div className="min-h-screen w-full flex items-center justify-center bg-neutral-950">
        <p className="font-orbitron text-[11px] uppercase tracking-[0.3em] text-gray-500">
          Memuat...
        </p>
      </div>
    );
  }

  if (!user) {
    return <LoginScreen auth={auth} />;
  }

  return <App userEmail={user.email} onLogout={() => auth.signOut()} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Root />);
</script>
